apiVersion: v1

kind: ConfigMap

metadata:

  name: taskflow-frontend-config

  namespace: taskflow


data:

  API_URL: "http://taskflow-api:5000"
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            # No trailing slash: preserve /api/ in the backend request.
            proxy_pass http://taskflow-api:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
