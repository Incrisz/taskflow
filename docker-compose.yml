services:
  frontend:
    build: ./frontend
    ports: ["3000:80"]
    environment:
      API_URL: http://api:5000/api
    depends_on: [api]
  api:
    build: ./backend
    environment:
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: taskflow
      DB_USER: taskflow
      DB_PASSWORD: taskflow123
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
  postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_DB: taskflow, POSTGRES_USER: taskflow, POSTGRES_PASSWORD: taskflow123}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck: {test: ["CMD-SHELL","pg_isready -U taskflow -d taskflow"], interval: 5s, timeout: 5s, retries: 10}
  redis:
    image: redis:7-alpine
volumes: {postgres-data: {}}