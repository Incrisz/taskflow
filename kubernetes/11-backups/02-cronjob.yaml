apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: taskflow
spec:
  schedule: 0 2 * * *
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app: postgres-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: postgres:17-alpine
              command:
                - /bin/sh
                - -c
              args:
                - |
                  set -eu
                  umask 077
                  stamp=$(date -u +%Y%m%dT%H%M%SZ)
                  partial="/backups/taskflow-${stamp}.dump.partial"
                  trap 'rm -f "$partial"' EXIT
                  pg_dump --format=custom --no-owner --file="$partial"
                  pg_restore --list "$partial" >/dev/null
                  mv "$partial" "/backups/taskflow-${stamp}.dump"
                  find /backups -name 'taskflow-*.dump' -type f -mtime +7 -delete
                  echo "Backup completed: taskflow-${stamp}.dump"
              env:
                - name: PGHOST
                  value: postgres
                - name: PGDATABASE
                  value: taskflow
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: taskflow-secret
                      key: DB_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: taskflow-secret
                      key: DB_PASSWORD
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: postgres-backups
            - name: tmp
              emptyDir: {}
