apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: taskflow}
spec: {clusterIP: None, selector: {app: postgres}, ports: [{port: 5432, targetPort: 5432}]}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres, namespace: taskflow}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
      - name: postgres
        image: postgres:17-alpine
        ports: [{containerPort: 5432}]
        env:
        - {name: POSTGRES_DB, value: taskflow}
        - name: POSTGRES_USER
          valueFrom: {secretKeyRef: {name: taskflow-secret, key: DB_USER}}
        - name: POSTGRES_PASSWORD
          valueFrom: {secretKeyRef: {name: taskflow-secret, key: DB_PASSWORD}}
        volumeMounts: [{name: postgres-data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
  - metadata: {name: postgres-data}
    spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 2Gi}}}
