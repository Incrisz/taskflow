apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: taskflow-node-reader
rules:
  - apiGroups:
      - ''
    resources:
      - nodes
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: taskflow-node-reader
subjects:
  - kind: ServiceAccount
    name: taskflow-reader
    namespace: taskflow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: taskflow-node-reader
