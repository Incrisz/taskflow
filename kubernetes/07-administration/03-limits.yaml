apiVersion: v1
kind: LimitRange
metadata:
  name: taskflow-defaults
  namespace: taskflow
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 500m
        memory: 512Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: taskflow-quota
  namespace: taskflow
spec:
  hard:
    requests.cpu: '4'
    requests.memory: 4Gi
    limits.cpu: '12'
    limits.memory: 12Gi
    pods: '30'
    persistentvolumeclaims: '5'
    requests.storage: 20Gi
