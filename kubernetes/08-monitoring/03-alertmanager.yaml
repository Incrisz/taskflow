apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    route:
      receiver: lab
      group_by:
      - alertname
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
    - name: lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.28.1
          ports:
            - containerPort: 9093
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          volumeMounts:
            - name: data
              mountPath: /alertmanager
            - name: config
              mountPath: /etc/alertmanager
              readOnly: true
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9093
            periodSeconds: 5
            initialDelaySeconds: 5
      volumes:
        - name: data
          emptyDir: {}
        - name: config
          configMap:
            name: alertmanager-config
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65534
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  selector:
    app: alertmanager
  ports:
    - port: 9093
      targetPort: 9093
