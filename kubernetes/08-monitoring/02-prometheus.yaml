apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
    - /etc/prometheus/alerts.yaml
    alerting:
      alertmanagers:
      - static_configs:
        - targets:
          - alertmanager:9093
    scrape_configs:
    - job_name: taskflow-api
      metrics_path: /metrics
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
          - taskflow
      relabel_configs:
      - source_labels:
        - __meta_kubernetes_pod_label_app
        regex: taskflow-api
        action: keep
      - source_labels:
        - __meta_kubernetes_pod_container_port_number
        regex: '5000'
        action: keep
      - source_labels:
        - __meta_kubernetes_pod_name
        target_label: pod
  alerts.yaml: |
    groups:
    - name: taskflow
      rules:
      - alert: TaskFlowAPINotScrapable
        expr: up{job="taskflow-api"} == 0 or absent(up{job="taskflow-api"})
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: TaskFlow API metrics are unavailable
      - alert: TaskFlowHighErrorRate
        expr: sum(rate(taskflow_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(taskflow_http_requests_total[5m])),
          0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: TaskFlow HTTP 5xx rate exceeds 5%
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.2.1
          ports:
            - containerPort: 9090
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=24h
          volumeMounts:
            - name: data
              mountPath: /prometheus
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            periodSeconds: 5
            initialDelaySeconds: 5
      volumes:
        - name: data
          emptyDir: {}
        - name: config
          configMap:
            name: prometheus-config
      serviceAccountName: prometheus
      securityContext:
        fsGroup: 65534
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
