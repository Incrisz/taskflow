{{- if .Values.frontend.enabled }}

apiVersion: apps/v1
kind: Deployment

metadata:

  name: taskflow-frontend


spec:

  replicas: {{ .Values.frontend.replicaCount }}


  selector:

    matchLabels:

      app: taskflow-frontend



  template:

    metadata:

      labels:

        app: taskflow-frontend



    spec:

      containers:

      - name: frontend

        image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"


        ports:

        - containerPort: 80


{{- end }}